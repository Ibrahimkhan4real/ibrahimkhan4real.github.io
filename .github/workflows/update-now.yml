name: Update Live status

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: write
  issues: read

concurrency:
  group: public-content-writes
  cancel-in-progress: false

jobs:
  update-now:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'current-status')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned content dependencies
        run: python -m pip install requests==2.32.3 PyYAML==6.0.2

      - name: Update structured Live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_now.py

      - name: Commit changes
        run: |
          if git diff --quiet -- _data/now.yml; then
            echo "No Live update to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/now.yml
          git commit -m "chore: update live status from verified issue"
          git push
