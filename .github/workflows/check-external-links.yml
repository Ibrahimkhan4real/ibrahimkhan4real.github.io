name: Check external links

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * 2"

permissions:
  contents: read

concurrency:
  group: external-link-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby and locked gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build production-metadata site
        run: npm run build

      - name: Check live external links
        run: npm run test:links:external
