---
layout: default
---

<header>
  <p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time></p>
</header>

<article>
  <div id="article_title">
    <h1>{{ page.title }}</h1>
  </div>
  <div id="article_text">
    {{ content }}
  </div>
</article>

<footer>
  <a class="button_accent" href="{{ '/blog.html' | relative_url }}">Back to blog</a>
</footer>
